<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Economic Indicators &mdash; The Plantation at Ponte Vedra</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f1117'/%3E%3Crect x='6' y='17' width='4' height='9' fill='%234f8ef7'/%3E%3Crect x='13' y='11' width='4' height='15' fill='%2334d399'/%3E%3Crect x='20' y='6' width='4' height='20' fill='%23fbbf24'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0f1117;--card:#1a1d27;--border:#2a2f47;--text:#e8eaf0;--muted:#7b82a8;--accent:#4f8ef7;--green:#34d399;--red:#f87171;--yellow:#fbbf24;--purple:#a78bfa;--teal:#2dd4bf;--orange:#fb923c;--pink:#e879f9;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.header h1{font-size:1.15rem;font-weight:700;}
.header .subtitle{font-size:0.72rem;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{font-size:0.7rem;padding:4px 12px;border-radius:20px;font-weight:600;}
.status-pill.live{background:#34d39920;color:var(--green);border:1px solid #34d39940;}
.status-pill.cached{background:#fbbf2420;color:var(--yellow);border:1px solid #fbbf2440;}
.status-pill.offline{background:#f8717120;color:var(--red);border:1px solid #f8717140;}
.btn-sm{padding:6px 14px;border-radius:7px;cursor:pointer;font-size:0.75rem;font-weight:600;border:1px solid var(--border);background:transparent;color:var(--muted);transition:all .15s;}
.btn-sm:hover{border-color:var(--accent);color:var(--text);}
.btn-sm:disabled{opacity:.4;cursor:default;}
.spin{display:inline-block;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.controls{padding:14px 28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--card);}
.controls label{font-size:0.72rem;color:var(--muted);}
.btn-group{display:flex;gap:4px;}
.range-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:6px;cursor:pointer;font-size:0.73rem;transition:all .15s;}
.range-btn:hover{border-color:var(--accent);color:var(--text);}
.range-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
#errorPanel{display:none;margin:14px 28px 0;background:#f8717110;border:1px solid #f8717140;border-radius:10px;padding:14px 18px;}
#errorPanel .err-title{font-size:0.8rem;font-weight:600;color:var(--red);margin-bottom:6px;}
#errorPanel .err-body{font-size:0.73rem;color:var(--muted);line-height:1.7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;}
.highlights{padding:18px 28px 0;}
.section-title{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
.hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;}
.hl-card{background:var(--card);border:1px solid var(--border);border-left:3px solid var(--hl-c,var(--border));border-radius:10px;padding:16px 18px;}
.hl-header{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.hl-icon{font-size:1.1rem;}
.hl-title{font-size:0.79rem;font-weight:700;}
.hl-badge{margin-left:auto;font-size:0.65rem;padding:2px 9px;border-radius:10px;font-weight:600;}
.hl-badge.pos{background:#34d39920;color:var(--green);}
.hl-badge.neg{background:#f8717120;color:var(--red);}
.hl-badge.warn{background:#fbbf2420;color:var(--yellow);}
.hl-text{font-size:0.76rem;color:var(--muted);line-height:1.65;}
.hl-metric{font-weight:600;color:var(--text);}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;padding:18px 28px 0;}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden;}
.kpi-card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:var(--acc,var(--accent));}
.kpi-label{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.kpi-value{font-size:1.7rem;font-weight:700;margin:5px 0 3px;line-height:1;}
.kpi-change{font-size:0.73rem;display:flex;align-items:center;gap:4px;}
.kpi-change.up{color:var(--green);}.kpi-change.down{color:var(--red);}.kpi-change.neutral{color:var(--muted);}
.kpi-date{font-size:0.63rem;color:var(--muted);margin-top:2px;}
.group-title{font-size:0.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600;padding:24px 28px 0;}
.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:12px 28px 0;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;}
.chart-card.wide{grid-column:1/-1;}
.chart-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;}
.chart-title{font-size:0.83rem;font-weight:600;}
.chart-sub{font-size:0.68rem;color:var(--muted);margin-top:3px;}
.chart-badge-val{font-size:1.05rem;font-weight:700;text-align:right;white-space:nowrap;}
.chart-badge-chg{font-size:0.68rem;margin-top:2px;text-align:right;color:var(--muted);white-space:nowrap;}
.chart-wrap{position:relative;height:210px;}
.chart-wrap.tall{height:280px;}
.sources{padding:28px;}
.src-inner{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;}
.src-title{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:7px;}
.src-list{display:flex;flex-wrap:wrap;gap:12px;}
.src-list a{font-size:0.71rem;color:var(--accent);text-decoration:none;}
.src-list a:hover{text-decoration:underline;}
.src-note{font-size:0.68rem;color:var(--muted);margin-top:10px;line-height:1.6;}
@media(max-width:860px){.charts-grid{grid-template-columns:1fr;}.chart-card.wide{grid-column:1;}.header,.controls,.highlights,.kpi-grid,.charts-grid,.group-title,.sources{padding-left:16px;padding-right:16px;}}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>&#128202; Economic Indicators Dashboard</h1>
    <div class="subtitle" id="subtitle">The Plantation at Ponte Vedra &middot; Finance</div>
  </div>
  <div class="header-right">
    <span class="status-pill offline" id="statusPill">&#9679; Loading&hellip;</span>
    <button class="btn-sm" id="refreshBtn">&#8635; Refresh</button>
  </div>
</div>

<div class="controls">
  <label>Time Range:</label>
  <div class="btn-group">
    <button class="range-btn" data-r="12">1Y</button>
    <button class="range-btn" data-r="24">2Y</button>
    <button class="range-btn active" data-r="60">5Y</button>
    <button class="range-btn" data-r="120">10Y</button>
    <button class="range-btn" data-r="0">All</button>
  </div>
</div>

<div id="errorPanel">
  <div class="err-title">&#9888; Data load problem</div>
  <div class="err-body" id="errorBody"></div>
</div>

<div class="highlights" id="highlightsSection" style="display:none">
  <div class="section-title" id="hlToggle">&#128204; Latest Highlights <span id="hlArrow">[-]</span></div>
  <div class="hl-grid" id="hlGrid"></div>
</div>

<div class="kpi-grid" id="kpiGrid"></div>
<div id="chartSections"></div>

<div class="sources">
  <div class="src-inner">
    <div class="src-title">Data Sources &mdash; FRED, Federal Reserve Bank of St. Louis</div>
    <div class="src-list" id="srcList"></div>
    <div class="src-note" id="srcNote"></div>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 * Data comes from ./data.json, refreshed nightly by a GitHub Action
 * (.github/workflows/update-data.yml). The browser never calls the
 * FRED API directly -- FRED sends no CORS headers, so it cannot.
 * ------------------------------------------------------------------ */

Chart.defaults.color = "#7b82a8";
Chart.defaults.borderColor = "#2a2f47";
Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif";
Chart.defaults.font.size = 11;

var C = {blue:"#4f8ef7", green:"#34d399", red:"#f87171", yellow:"#fbbf24",
         purple:"#a78bfa", teal:"#2dd4bf", orange:"#fb923c", pink:"#e879f9",
         sky:"#60a5fa", amber:"#f59e0b", rose:"#fb7185", lime:"#a3e635"};

var D = null;                 // parsed data.json
var S = null;                 // shorthand for D.series
var activeRange = 60;
var charts = {};

/* ---------- small helpers ---------- */
var last  = function(a){ return (a && a.length) ? a[a.length-1] : null; };
var back  = function(a,n){ return (a && a.length>n) ? a[a.length-1-n] : null; };
var slice = function(a,n){ return (n && a) ? a.slice(-n) : (a||[]); };
var num   = function(v,d){ return (v===null||v===undefined||isNaN(v)) ? "--" : v.toFixed(d===undefined?1:d); };
var sign  = function(v,d){ return (v>=0?"+":"") + num(v,d); };
var rateAt = function(key,n){
  var rows = (S.rates||[]).filter(function(r){ return r[key]!==undefined && r[key]!==null; });
  return n ? back(rows,n) : last(rows);
};
var monthLabel = function(m){
  if(!m) return "";
  var names=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return names[parseInt(m.slice(5,7),10)-1] + " " + m.slice(0,4);
};
var valueAt = function(series, month){
  for(var i=series.length-1;i>=0;i--){ if(series[i].d===month) return series[i]; }
  return null;
};

/* ---------- status ---------- */
function setStatus(kind, text){
  var p = document.getElementById("statusPill");
  p.className = "status-pill " + kind;
  p.textContent = (kind==="live"?"🟢 ":kind==="cached"?"🟡 ":"🔴 ") + text;
}
function showError(msg){
  document.getElementById("errorPanel").style.display = "block";
  document.getElementById("errorBody").textContent = msg;
}
function hideError(){ document.getElementById("errorPanel").style.display = "none"; }

/* ---------- load ---------- */
function loadData(){
  var btn = document.getElementById("refreshBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin">&#8635;</span> Loading...';

  return fetch("data.json?ts=" + Date.now(), {cache:"no-store"})
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status + " fetching data.json");
      return r.json();
    })
    .then(function(json){
      if(!json || !json.series || !json.series.unemployment)
        throw new Error("data.json is present but has no series in it");
      D = json; S = json.series;
      hideError();

      var built = new Date(D.generated);
      var ageDays = (Date.now() - built.getTime()) / 86400000;
      var stamp = built.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
      if(ageDays > 4){
        setStatus("cached", "Stale — last built " + stamp);
        showError("data.json was last built " + Math.floor(ageDays) + " days ago.\n" +
                  "The nightly refresh may be failing. Check the Actions tab:\n" +
                  "  Repository → Actions → “Update FRED data” → latest run.");
      } else {
        setStatus("live", "Updated " + stamp);
      }
      document.getElementById("subtitle").textContent =
        "The Plantation at Ponte Vedra · Finance · data through " +
        monthLabel(last(S.unemployment).d);

      render();
    })
    .catch(function(err){
      setStatus("offline", "No data");
      showError(err.message + "\n\n" +
        "data.json has not been generated yet, or the nightly job has never run.\n" +
        "Fix: Repository → Actions → “Update FRED data” → Run workflow.\n" +
        "That writes data.json and this page will populate on the next reload.");
    })
    .then(function(){
      btn.disabled = false;
      btn.innerHTML = "&#8635; Refresh";
    });
}

/* ================================================================== *
 * HIGHLIGHTS - written for a club / community association CFO
 * ================================================================== */
function buildHighlights(){
  var cards = [];

  var u = last(S.unemployment), uy = back(S.unemployment,12);
  var fl = last(S.fl_unemployment), fly = back(S.fl_unemployment,12);
  var nf = last(S.nonfarm);
  var nf6 = slice(S.nonfarm,6);
  var nfAvg = Math.round(nf6.reduce(function(a,b){return a+b.v;},0) / nf6.length);
  var wLH = last(S.wages_lh);
  var cpi = last(S.cpi), core = last(S.core_cpi);
  var realWage = (wLH && wLH.yoy!=null && cpi) ? wLH.yoy - cpi.v : null;

  cards.push({
    icon:"&#128119;", title:"Labor &amp; Staffing Cost",
    badge: realWage==null ? {c:"warn",t:"Mixed"} : realWage > 1 ? {c:"neg",t:"Cost Pressure"} : realWage > 0 ? {c:"warn",t:"Moderate"} : {c:"pos",t:"Easing"},
    color: realWage==null ? "var(--yellow)" : realWage > 1 ? "var(--red)" : realWage > 0 ? "var(--yellow)" : "var(--green)",
    html: "Florida unemployment <span class='hl-metric'>" + num(fl.v) + "%</span>" +
          (fly ? " (" + (fl.v>=fly.v?"up":"down") + " " + num(Math.abs(fl.v-fly.v)) + "pp YoY)" : "") +
          " vs. <span class='hl-metric'>" + num(u.v) + "%</span> nationally. " +
          "Leisure &amp; hospitality wages <span class='hl-metric'>$" + num(wLH.v,2) + "/hr</span>, " +
          "<span class='hl-metric'>" + sign(wLH.yoy,1) + "%</span> YoY" +
          (realWage!=null ? " &mdash; <span class='hl-metric'>" + sign(realWage,1) + "pp</span> above CPI, the real increase in club payroll cost per hour." : ".") +
          " US payrolls averaging <span class='hl-metric'>" + sign(nfAvg,0) + "K/mo</span> over 6 months."
  });

  cards.push({
    icon:"&#128200;", title:"Inflation &amp; Dues Setting",
    badge: cpi.v <= 2.5 ? {c:"pos",t:"Near Target"} : cpi.v <= 4 ? {c:"warn",t:"Elevated"} : {c:"neg",t:"High"},
    color: cpi.v <= 2.5 ? "var(--green)" : cpi.v <= 4 ? "var(--yellow)" : "var(--red)",
    html: "Headline CPI <span class='hl-metric'>" + num(cpi.v) + "%</span> YoY, core <span class='hl-metric'>" + num(core.v) + "%</span>. " +
          "Core is the better anchor for a dues increase &mdash; it strips the food and energy swings that reverse. " +
          "A flat-dollar dues hold this year is a real revenue cut of roughly <span class='hl-metric'>" + num(core.v) + "%</span>. " +
          (cpi.v > core.v ? "Headline running above core means energy and food are currently adding to the pressure."
                          : "Headline running below core means energy and food are currently masking underlying inflation.")
  });

  var fa = last(S.food_away);
  cards.push({
    icon:"&#127869;", title:"F&amp;B Cost Pressure",
    badge: fa.v <= 3 ? {c:"pos",t:"Contained"} : fa.v <= 5 ? {c:"warn",t:"Elevated"} : {c:"neg",t:"High"},
    color: fa.v <= 3 ? "var(--green)" : fa.v <= 5 ? "var(--yellow)" : "var(--red)",
    html: "Food away from home <span class='hl-metric'>" + num(fa.v) + "%</span> YoY vs. headline CPI <span class='hl-metric'>" + num(cpi.v) + "%</span>. " +
          "This is the closest public benchmark to clubhouse dining cost. " +
          (fa.v > cpi.v
            ? "Running <span class='hl-metric'>" + num(fa.v-cpi.v) + "pp</span> hotter than overall inflation &mdash; menu pricing held flat will compress F&amp;B margin."
            : "Running at or below overall inflation &mdash; F&amp;B input pressure is not the binding constraint right now.")
  });

  var cp = last(S.construction_ppi);
  var base = valueAt(S.construction_ppi, "2021-01");
  var cum = null;
  if(S.construction_ppi.length > 60){
    // compound the last 60 monthly YoY readings is wrong; use index-free approach:
    // approximate 5-year escalation by chaining the Jan-to-Jan YoY prints we have.
    var years = {}, i;
    for(i=0;i<S.construction_ppi.length;i++){
      var row = S.construction_ppi[i];
      if(row.d.slice(5,7)==="01") years[row.d.slice(0,4)] = row.v;
    }
    var keys = Object.keys(years).sort().slice(-5);
    if(keys.length){
      var factor = 1;
      for(i=0;i<keys.length;i++) factor *= (1 + years[keys[i]]/100);
      cum = (factor - 1) * 100;
    }
  }
  cards.push({
    icon:"&#127959;", title:"Capital &amp; Reserve Cost Escalation",
    badge: cp.v <= 2 ? {c:"pos",t:"Stable"} : cp.v <= 5 ? {c:"warn",t:"Escalating"} : {c:"neg",t:"Steep"},
    color: cp.v <= 2 ? "var(--green)" : cp.v <= 5 ? "var(--yellow)" : "var(--red)",
    html: "Construction input costs <span class='hl-metric'>" + num(cp.v) + "%</span> YoY" +
          (cum!=null ? ", roughly <span class='hl-metric'>" + num(cum,0) + "%</span> cumulative over the last five years" : "") + ". " +
          "Reserve studies priced before that escalation understate replacement cost. " +
          (cp.v > 3 ? "At this rate, any reserve funding plan using a 2&ndash;3% escalator is falling behind each year it is not revisited."
                    : "Escalation is close to the 2&ndash;3% assumption most reserve studies use, so existing funding plans should still hold.")
  });

  var tb = rateAt("tb3ms"), tbY = rateAt("tb3ms",12);
  var realYield = (tb && cpi) ? tb.tb3ms - cpi.v : null;
  cards.push({
    icon:"&#127974;", title:"Reserve Investment Yield",
    badge: realYield==null ? {c:"warn",t:"Mixed"} : realYield >= 1 ? {c:"pos",t:"Positive Real"} : realYield >= 0 ? {c:"warn",t:"Thin"} : {c:"neg",t:"Negative Real"},
    color: realYield==null ? "var(--yellow)" : realYield >= 1 ? "var(--green)" : realYield >= 0 ? "var(--yellow)" : "var(--red)",
    html: "3-month T-bill <span class='hl-metric'>" + num(tb.tb3ms,2) + "%</span>" +
          (tbY ? " (" + (tb.tb3ms>=tbY.tb3ms?"up":"down") + " " + num(Math.abs(tb.tb3ms-tbY.tb3ms),2) + "pp YoY)" : "") +
          ", overnight SOFR <span class='hl-metric'>" + num(rateAt("sofr").sofr,2) + "%</span>. " +
          (realYield!=null
            ? "Against <span class='hl-metric'>" + num(cpi.v) + "%</span> inflation that is a <span class='hl-metric'>" + sign(realYield,1) + "pp</span> real return on reserve cash. " +
              (realYield >= 0 ? "Reserve balances held in bills are holding purchasing power." : "Reserve balances held in cash are losing purchasing power.")
            : "")
  });

  var pr = rateAt("prime"), ten = rateAt("ten_yr"), tenY = rateAt("ten_yr",12);
  cards.push({
    icon:"&#128176;", title:"Borrowing &amp; Financing",
    badge: ten.ten_yr < 4 ? {c:"pos",t:"Easing"} : ten.ten_yr < 5 ? {c:"warn",t:"Elevated"} : {c:"neg",t:"High"},
    color: ten.ten_yr < 4 ? "var(--green)" : ten.ten_yr < 5 ? "var(--yellow)" : "var(--red)",
    html: "10-year Treasury <span class='hl-metric'>" + num(ten.ten_yr,2) + "%</span>" +
          (tenY ? " (" + (ten.ten_yr>=tenY.ten_yr?"up":"down") + " " + num(Math.abs(ten.ten_yr-tenY.ten_yr),2) + "pp YoY)" : "") +
          ", prime <span class='hl-metric'>" + num(pr.prime,2) + "%</span>. " +
          "Bank quotes for association capital projects typically price off prime or the 5&ndash;10 year curve. " +
          (ten.ten_yr >= 4.5
            ? "At this level, financing a project is materially more expensive than assessing for it &mdash; worth modelling both."
            : "Financing costs have come down enough that a debt-funded project is worth comparing against a special assessment.")
  });

  var pos=0, neg=0, warn=0;
  cards.forEach(function(c){ if(c.badge.c==="pos")pos++; else if(c.badge.c==="neg")neg++; else warn++; });
  var overall = neg >= 3 ? "Cautious" : pos >= 3 ? "Favorable" : "Mixed";
  cards.unshift({
    icon:"&#128301;", title:"Overall Environment",
    badge:{c: overall==="Favorable"?"pos":overall==="Cautious"?"neg":"warn", t:overall},
    color: overall==="Favorable"?"var(--green)":overall==="Cautious"?"var(--red)":"var(--yellow)",
    html:"<span class='hl-metric'>" + pos + " favorable</span>, <span class='hl-metric'>" + warn + " mixed</span>, " +
         "<span class='hl-metric'>" + neg + " unfavorable</span> across the six tracked areas. " +
         (overall==="Favorable"
            ? "Cost and rate backdrop supports holding dues growth moderate and moving on deferred capital."
            : overall==="Cautious"
            ? "Multiple cost headwinds at once &mdash; build contingency into the operating budget and re-price the capital plan before committing."
            : "Costs are manageable but not benign. The live questions are the dues escalator and whether the reserve plan still reflects current construction pricing.")
  });

  document.getElementById("hlGrid").innerHTML = cards.map(function(h){
    return '<div class="hl-card" style="--hl-c:'+h.color+'">' +
             '<div class="hl-header"><span class="hl-icon">'+h.icon+'</span>' +
             '<span class="hl-title">'+h.title+'</span>' +
             '<span class="hl-badge '+h.badge.c+'">'+h.badge.t+'</span></div>' +
             '<div class="hl-text">'+h.html+'</div></div>';
  }).join("");
  document.getElementById("highlightsSection").style.display = "block";
}

/* ================================================================== *
 * KPI CARDS
 * ================================================================== */
function buildKPIs(){
  var K = [
    {l:"Unemployment (US)",  c:C.blue,   inv:true,  u:"pp YoY",   cur:function(){return last(S.unemployment);},  prv:function(){return back(S.unemployment,12);},  f:function(x){return num(x.v)+"%";},        ch:function(a,b){return a&&b?a.v-b.v:null;}},
    {l:"Unemployment (FL)",  c:C.sky,    inv:true,  u:"pp YoY",   cur:function(){return last(S.fl_unemployment);},prv:function(){return back(S.fl_unemployment,12);},f:function(x){return num(x.v)+"%";},        ch:function(a,b){return a&&b?a.v-b.v:null;}},

    {l:"Core CPI",           c:C.rose,   inv:true,  u:"pp YoY",   cur:function(){return last(S.core_cpi);},      prv:function(){return back(S.core_cpi,12);},      f:function(x){return num(x.v)+"%";},        ch:function(a,b){return a&&b?a.v-b.v:null;}},

    {l:"Construction Inputs",c:C.yellow, inv:true,  u:"pp YoY",   cur:function(){return last(S.construction_ppi);},prv:function(){return back(S.construction_ppi,12);},f:function(x){return num(x.v)+"%";},   ch:function(a,b){return a&&b?a.v-b.v:null;}},
    {l:"L&H Hourly Wage",    c:C.lime,   inv:true,  u:"% YoY",    cur:function(){return last(S.wages_lh);},      prv:function(){return null;},                     f:function(x){return "$"+num(x.v,2);},      ch:function(a){return a?a.yoy:null;}},
    {l:"3-Mo T-Bill",        c:C.teal,   inv:false, u:"pp YoY",   cur:function(){return rateAt("tb3ms");},       prv:function(){return rateAt("tb3ms",12);},       f:function(x){return num(x.tb3ms,2)+"%";},  ch:function(a,b){return a&&b?a.tb3ms-b.tb3ms:null;}},
    {l:"10-Year Treasury",   c:C.purple, inv:true,  u:"pp YoY",   cur:function(){return rateAt("ten_yr");},      prv:function(){return rateAt("ten_yr",12);},      f:function(x){return num(x.ten_yr,2)+"%";}, ch:function(a,b){return a&&b?a.ten_yr-b.ten_yr:null;}},
    {l:"Prime Rate",         c:C.amber,  inv:true,  u:"pp YoY",   cur:function(){return rateAt("prime");},       prv:function(){return rateAt("prime",12);},       f:function(x){return num(x.prime,2)+"%";},  ch:function(a,b){return a&&b?a.prime-b.prime:null;}},
    {l:"Housing Starts",     c:C.pink,   inv:false, u:"K YoY",    cur:function(){return last(S.housing);},       prv:function(){return back(S.housing,12);},       f:function(x){return num(x.v,0)+"K";},      ch:function(a,b){return a&&b?a.v-b.v:null;}}
  ];

  document.getElementById("kpiGrid").innerHTML = K.map(function(k){
    var cur = k.cur(), prv = k.prv(), ch = cur ? k.ch(cur, prv) : null;
    var cls = (ch===null||ch===undefined) ? "neutral" : ((ch>0)!==k.inv ? "up" : "down");
    var arrow = (ch===null||ch===undefined) ? "" : (ch>0 ? "&#9650; " : "&#9660; ") + num(Math.abs(ch),2);
    return '<div class="kpi-card" style="--acc:'+k.c+'">' +
             '<div class="kpi-label">'+k.l+'</div>' +
             '<div class="kpi-value" style="color:'+k.c+'">'+(cur?k.f(cur):"--")+'</div>' +
             '<div class="kpi-change '+cls+'">'+arrow+' <span style="color:var(--muted)">'+k.u+'</span></div>' +
             '<div class="kpi-date">'+(cur?monthLabel(cur.d):"")+'</div>' +
           '</div>';
  }).join("");
}

/* ================================================================== *
 * CHARTS
 * ================================================================== */
function lineSet(label, data, color, fill, dash){
  return {label:label, data:data, borderColor:color,
          backgroundColor: fill ? color+"28" : "transparent",
          borderWidth:2, pointRadius:0, pointHoverRadius:4, tension:0.3,
          fill:!!fill, borderDash:dash||[], spanGaps:true};
}
function barSet(label, data, color){
  return {label:label, data:data,
          backgroundColor: data.map(function(v){ return v>=0 ? color+"cc" : "#f87171cc"; }),
          borderRadius:2, borderSkipped:false};
}
function baseOpts(fmt, legend){
  return {responsive:true, maintainAspectRatio:false,
    interaction:{intersect:false, mode:"index"},
    plugins:{
      legend:{display:!!legend, position:"top", labels:{boxWidth:10, padding:14, color:"#7b82a8"}},
      tooltip:{backgroundColor:"#1a1d27", borderColor:"#2a2f47", borderWidth:1, padding:10,
               titleColor:"#e8eaf0", bodyColor:"#7b82a8",
               callbacks:{title:function(items){ return monthLabel(items[0].label); }}}
    },
    scales:{
      x:{grid:{color:"#2a2f4740"}, ticks:{maxTicksLimit:7, maxRotation:0}},
      y:{grid:{color:"#2a2f4740"}, ticks:{callback:fmt}}
    }};
}
function dualOpts(fmt){
  var o = baseOpts(fmt, true);
  o.scales.y2 = {grid:{drawOnChartArea:false}, position:"right",
                 ticks:{callback:function(v){return v.toFixed(1)+"%";}},
                 title:{display:true, text:"YoY %", color:"#7b82a8", font:{size:10}}};
  return o;
}
function draw(id, type, labels, datasets, opts){
  var el = document.getElementById(id);
  if(!el) return;
  if(charts[id]) charts[id].destroy();
  charts[id] = new Chart(el.getContext("2d"), {type:type, data:{labels:labels, datasets:datasets}, options:opts});
}

/* Chart.js hands ticks raw floats, so always round -- otherwise an axis
   step lands on values like 7.200000000000001 and prints all of it. */
var pct  = function(v){ return (Math.round(v*10)/10).toFixed(1) + "%"; };
var pctK = function(v){ return Math.round(v).toLocaleString() + "K"; };
var usd  = function(v){ return "$" + Math.round(v); };

/* Chart definitions, grouped into sections. */

       var fl=slice(S.fl_unemployment,activeRange), us=slice(S.unemployment,activeRange);
       draw("cUnemp","line", fl.map(function(x){return x.d;}),
         [lineSet("Florida", fl.map(function(x){return x.v;}), C.sky, true),
          lineSet("United States", us.map(function(x){return x.v;}), C.blue, false, [5,3])],
         baseOpts(pct, true));
     }},
    {id:"cPayroll", title:"Non-Farm Payrolls", sub:"Monthly net change in US employment (thousands)",

     build:function(){

       draw("cFood","line", f.map(function(x){return x.d;}),
         [lineSet("Food Away From Home", f.map(function(x){return x.v;}), C.orange, true),

     }},
    {id:"cConstr", title:"Construction Input Costs", sub:"PPI, inputs to construction industries &mdash; year-over-year",

  {name:"Rates &mdash; Reserve Yield &amp; Financing Cost", charts:[

     badge:function(){ var t=rateAt("ten_yr"), p=rateAt("prime");
       return {v:num(t.ten_yr,2)+"% / "+num(p.prime,2)+"%", c:C.purple, d:"10-yr / prime · "+monthLabel(t.d)}; },
     wide:true, tall:true,
     build:function(){
       var r=slice(S.rates,activeRange), lbl=r.map(function(x){return x.d;});

       draw("cRates","line", lbl,
         [lineSet("Fed Funds", pick("fedfunds"), C.red, false, [2,2]),

          lineSet("2-Yr", pick("two_yr"), C.pink),
          lineSet("5-Yr", pick("five_yr"), C.purple),
          lineSet("10-Yr", pick("ten_yr"), C.blue),
          lineSet("Prime", pick("prime"), C.orange)],
         baseOpts(pct, true));
     }}
  ]},

  {name:"Consumer, Housing &amp; Commodities", charts:[
    {id:"cIncome", title:"Real Disposable Income", sub:"Billions of chained 2017 dollars, seasonally adjusted annual rate",
     badge:function(){ var i=last(S.disposable); return {v:"$"+num(i.v/1000)+"T", c:C.teal, d:monthLabel(i.d)}; },
     build:function(){
       var i=slice(S.disposable,activeRange);
       draw("cIncome","line", i.map(function(x){return x.d;}),
         [Object.assign(lineSet("Real Disposable Income", i.map(function(x){return x.v;}), C.teal, true), {yAxisID:"y"}),
          Object.assign(lineSet("YoY %", i.map(function(x){return x.yoy;}), C.sky, false, [4,4]), {yAxisID:"y2"})],
         dualOpts(function(v){ return "$"+(v/1000).toFixed(1)+"T"; }));
     }},
    {id:"cServices", title:"Consumer Services Spending", sub:"Real PCE services, billions of chained 2017 dollars",
     badge:function(){ var s=last(S.consumer_services); return {v:"$"+num(s.v/1000)+"T", c:C.sky, d:monthLabel(s.d)}; },
     build:function(){
       var s=slice(S.consumer_services,activeRange);
       draw("cServices","line", s.map(function(x){return x.d;}),

          Object.assign(lineSet("YoY %", s.map(function(x){return x.yoy;}), C.green, false, [4,4]), {yAxisID:"y2"})],

    {id:"cCrude", title:"WTI Crude Oil", sub:"Monthly average spot price per barrel",

     wide:true,
     build:function(){
       var u=slice(S.usd,activeRange);
       draw("cUSD","line", u.map(function(x){return x.d;}),

function buildChartShells(){
  document.getElementById("chartSections").innerHTML = SECTIONS.map(function(sec){
    var cards = sec.charts.map(function(c){
      var b = c.badge();
      return '<div class="chart-card'+(c.wide?" wide":"")+'">' +
               '<div class="chart-header">' +
                 '<div><div class="chart-title">'+c.title+'</div><div class="chart-sub">'+c.sub+'</div></div>' +
                 '<div><div class="chart-badge-val" style="color:'+b.c+'">'+b.v+'</div>' +
                 '<div class="chart-badge-chg">'+b.d+'</div></div>' +
               '</div>' +
               '<div class="chart-wrap'+(c.tall?" tall":"")+'"><canvas id="'+c.id+'"></canvas></div>' +
             '</div>';
    }).join("");
    return '<div class="group-title">'+sec.name+'</div><div class="charts-grid">'+cards+'</div>';
  }).join("");
}
function buildCharts(){
  SECTIONS.forEach(function(sec){ sec.charts.forEach(function(c){ c.build(); }); });
}

  ["UNRATE","Unemployment Rate (US)"], ["FLUR","Unemployment Rate (Florida)"],
  ["PAYEMS","Total Non-Farm Payrolls"], ["CES7000000003","Avg Hourly Earnings, Leisure & Hospitality"],
  ["CES0500000003","Avg Hourly Earnings, Total Private"], ["CPIAUCSL","CPI, All Items"],
  ["CPILFESL","CPI, Core"], ["CUSR0000SEFV","CPI, Food Away From Home"],
  ["WPUSI012011","PPI, Inputs to Construction"], ["TB3MS","3-Month Treasury Bill"],
  ["DGS2","2-Year Treasury"], ["DGS5","5-Year Treasury"], ["DGS10","10-Year Treasury"],
  ["MPRIME","Bank Prime Loan Rate"], ["SOFR","Secured Overnight Financing Rate"],
  ["FEDFUNDS","Federal Funds Effective Rate"], ["DSPIC96","Real Disposable Personal Income"],
  ["PCESC96","Real PCE, Services"], ["HOUST","Housing Starts"],
  ["MCOILWTICO","WTI Crude Oil"], ["DTWEXBGS","Nominal Broad USD Index"]
];
function buildSources(){
  document.getElementById("srcList").innerHTML = SOURCES.map(function(s){
    return '<a href="https://fred.stlouisfed.org/series/'+s[0]+'" target="_blank" rel="noopener">'+s[0]+' &mdash; '+s[1]+'</a>';
  }).join("");
  document.getElementById("srcNote").innerHTML =
    "Daily series (2/5/10-year Treasury, SOFR, USD index) are averaged to monthly. " +
    "Payrolls are the month-over-month change in total non-farm employment. " +
    "CPI, PPI and wage series are shown as year-over-year percent change. " +
    "data.json is rebuilt from FRED every morning by a scheduled GitHub Action" +
    (D && D.generated ? "; this copy was built " + new Date(D.generated).toLocaleString("en-US") + "." : ".");
}

/* ================================================================== *
 * WIRING
 * ================================================================== */
function render(){
  buildHighlights();
  buildKPIs();
  buildChartShells();
  buildCharts();
  buildSources();
}

document.querySelectorAll(".range-btn").forEach(function(b){
  b.addEventListener("click", function(){
    document.querySelectorAll(".range-btn").forEach(function(x){ x.classList.remove("active"); });
    b.classList.add("active");
    activeRange = +b.dataset.r;
    if(D) buildCharts();
  });
});
document.getElementById("refreshBtn").addEventListener("click", function(){ loadData(); });
document.getElementById("hlToggle").addEventListener("click", function(){
  var g = document.getElementById("hlGrid");
  var open = g.style.display !== "none";
  g.style.display = open ? "none" : "";
  document.getElementById("hlArrow").textContent = open ? "[+]" : "[-]";
});

loadData();
